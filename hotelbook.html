<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Booking - Mumbai Tourism</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="auth.js"></script>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    
      color: #333;
    }
    .booking-container {
      background: white;
      max-width: 650px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; color: #0077b6; }
    label { font-weight: 600; margin-top: 15px; display: block; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    input:invalid, select:invalid {
      border-color: #ff4d4d;
    }
    input:valid, select:valid {
      border-color: #4caf50;
    }
    button {
      margin-top: 20px;
      padding: 12px 18px;
      background: #0077b6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #023e8a; }
    #confirmation {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .btns {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
  <link rel="stylesheet" href="global-theme.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏙️ Explore Mumbai</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="places.html">Places</a></li>
                <li class="nav-item"><a class="nav-link" href="food.html">Food</a></li>
                <li class="nav-item"><a class="nav-link" href="itinerary.html">Itinerary</a></li>
                <li class="nav-item"><a class="nav-link" href="hotel.html">Hotel</a></li>
                <li class="nav-item"><a class="nav-link" href="weather.html">Weather</a></li>
                <li class="nav-item"><a class="nav-link" href="feedback.html">Reviews</a></li>
                
                <li class="nav-item">
                    <a id="dynamic-auth-button" class="nav-link btn btn-primary text-white ms-lg-2" href="login.html">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

  <!-- Booking Container -->
  <div class="booking-container">
    <h2>Hotel Booking</h2>
    <form id="bookingForm" novalidate>
      <label>Your Name</label>
      <input type="text" id="name" placeholder="Enter your full name" pattern="[A-Za-z\s]{3,}" required>

      <label>Check-in Date</label>
      <input type="date" id="checkin" required>

      <label>Hotel Name</label>
      <input type="text" id="hotelName" readonly>

      <label>Room Type</label>
      <select id="roomType" required>
        <option value="">-- Select Room Type --</option>
        <option>Deluxe Room</option>
        <option>Suite</option>
        <option>Budget Room</option>
      </select>

      <label>Price per Night (₹)</label>
      <input type="text" id="price" readonly>

      <label>Number of Nights</label>
      <input type="number" id="nights" min="1" required>

      <label>Total Price (₹)</label>
      <input type="text" id="total" readonly>

      <button type="submit">Confirm Booking</button>
    </form>

    <div id="confirmation">
      <h3>✅ Booking Confirmed!</h3>
      <p id="receipt"></p>
      <div class="btns">
        <button onclick="window.print()">🖨️ Print Receipt</button>
        <button id="downloadPDF">💾 Download PDF</button>
      </div>
    </div>
  </div>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const hotelName = params.get("name") || "The Taj Mahal Palace";
    const basePrice = parseInt(params.get("price")) || 18000;
    const days = parseInt(params.get("days")) || 2;
    const roomTypeParam = params.get("room") || "Deluxe Room";

    // Fill fields automatically
    document.getElementById("hotelName").value = hotelName;
    document.getElementById("price").value = basePrice;
    document.getElementById("roomType").value = roomTypeParam;
    document.getElementById("nights").value = days;
    document.getElementById("total").value = basePrice * days;

    // Set min date (no past bookings)
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("checkin").setAttribute("min", today);

    // Update total dynamically
    document.getElementById("nights").addEventListener("input", () => {
      const nights = parseInt(document.getElementById("nights").value) || 0;
      document.getElementById("total").value = basePrice * nights;
    });

    // 🧾 Form validation and submission
    document.getElementById("bookingForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const form = e.target;

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const name = document.getElementById("name").value.trim();
      const checkin = document.getElementById("checkin").value;
      const roomType = document.getElementById("roomType").value;
      const nights = document.getElementById("nights").value;
      const total = document.getElementById("total").value;

      document.getElementById("bookingForm").style.display = "none";
      document.getElementById("confirmation").style.display = "block";
      document.getElementById("receipt").innerHTML = `
        <strong>Name:</strong> ${name}<br>
        <strong>Hotel:</strong> ${hotelName}<br>
        <strong>Room Type:</strong> ${roomType}<br>
        <strong>Check-in Date:</strong> ${checkin}<br>
        <strong>Nights:</strong> ${nights}<br>
        <strong>Total Price:</strong> ₹${total}
      `;

      // 📄 PDF generation
      document.getElementById("downloadPDF").onclick = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFillColor(0, 119, 182);
        doc.rect(0, 0, 210, 25, "F");
        doc.setFont("helvetica", "bold");
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(16);
        doc.text("Mumbai Tourism", 105, 17, { align: "center" });

        doc.setDrawColor(0, 119, 182);
        doc.rect(15, 35, 180, 110, "S");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.setTextColor(0, 119, 182);
        doc.text("Hotel Booking Receipt", 105, 45, { align: "center" });

        doc.setFont("helvetica", "normal");
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        let y = 60;
        doc.text(`Name: ${name}`, 25, y);
        doc.text(`Hotel: ${hotelName}`, 25, y + 10);
        doc.text(`Room Type: ${roomType}`, 25, y + 20);
        doc.text(`Check-in Date: ${checkin}`, 25, y + 30);
        doc.text(`Nights: ${nights}`, 25, y + 40);
        doc.text(`Total Price: ₹${total}`, 25, y + 50);

        doc.setFont("helvetica", "italic");
        doc.setFontSize(11);
        doc.setTextColor(100, 100, 100);
        doc.text("Thank you for booking with Mumbai Tourism!", 105, 145, { align: "center" });

        doc.save(`${name}_Hotel_Booking.pdf`);
      };
    });


   if (!localStorage.getItem("loggedInUser")) {
      // Remember this specific hotel booking page
      localStorage.setItem('redirectUrl', window.location.href); 

      alert("Please log in to book a hotel.");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
