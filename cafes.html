<main class="container content-section">
    <h2 class="section-title">Mumbai's Coziest Coffee Spots</h2>

</main>

<footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">© 2025 Explore Mumbai | All Rights Reserved</p>

<script>
  const data = [
    {
      location: "Bandra",
      cafes: [
        {
          name: "Cafe Irani Chai",
          image: "Cafe Irani Chai.jpeg",
          info: "Famous for its authentic Irani chai and vintage vibe, a must-visit for tea lovers."
        },
        {
          name: "The Bagel Shop",
          image: "The Bagel Shop.jpeg",
          info: "A cozy spot specializing in fresh bagels with a variety of cream cheese flavors."
        },
        {
          name: "Pali Village Cafe",
          image: "Pali Village Cafe.jpeg",
          info: "Rustic ambiance with an extensive menu of European dishes and excellent coffee."
        }
      ]
    },
    {
      location: "Colaba",
      cafes: [
        {
          name: "Leopold Cafe",
          image: "Leopold Cafe.jpeg",
          info: "Iconic cafe known for its lively atmosphere and classic Indian and continental dishes."
        },
        {
          name: "Cafe Mondegar",
          image: "Cafe Mondegar.jpeg",
          info: "One of Mumbai's oldest cafes with great music, art, and a fun vibe."
        },
        {
          name: "Kala Ghoda Cafe",
          image: "Kala Ghoda Cafe.jpeg",
          info: "Charming cafe offering organic coffee and healthy, fresh meals."
        }
      ]
    },
    {
      location: "Juhu",
      cafes: [
        {
          name: "Prithvi Cafe",
          image: "Prithvi Cafe.jpeg",
          info: "Nestled in a beautiful garden, great for coffee and peaceful reading."
        },
        {
          name: "Salt Water Cafe",
          image: "Salt Water Cafe.jpeg",
          info: "Known for fresh seafood and a relaxed coastal vibe."
        },
        {
          name: "The Nutcracker",
          image: "The Nutcracker.jpeg",
          info: "Popular brunch spot with excellent pancakes and coffee."
        }
      ]
    },
    {
      location: "Andheri",
      cafes: [
        {
          name: "Bombay Coffee House",
          image: "Bombay Coffee House.jpeg",
          info: "Cozy and casual, known for rich coffee blends and baked goods."
        },
        {
          name: "The Little Door",
          image: "The Little Door.jpeg",
          info: "Lively cafe with good food, cocktails, and a great atmosphere."
        },
        {
          name: "Moka",
          image: "Moka.jpeg",
          info: "Trendy spot with delicious coffee and contemporary menu."
        }
      ]
    },
    {
      location: "Fort",
      cafes: [
        {
          name: "Blue Tokai Coffee Roasters",
          image: "Blue Tokai Coffee Roasters.jpeg",
          info: "Specialty coffee roasters with great brews and cozy seating."
        },
        {
          name: "Coffee by Di Bella",
          image: "Coffee by Di Bella.jpeg",
          info: "Popular for espresso shots, cold brews, and hip vibe."
        },
        {
            name: "The Bake Shop",
            image: "The Bake Shop.jpeg",
            info: "A delightful bakery cafe known for its classic pastries, cakes, and coffee."
        }
      ]
    },
    {
      location: "Versova",
      cafes: [
        {
          name: "Cafe Mangii",
          image: "Cafe Mangii.jpeg",
          info: "Cozy cafe serving freshly baked goodies and artisanal coffee."
        },
        {
            name: "Leaping Windows",
            image: "Leaping Windows.jpeg",
            info: "A unique library cafe, perfect for comic book lovers and coffee enthusiasts."
        },
        {
            name: "The Yoga House",
            image: "The Yoga House.jpeg",
            info: "A tranquil space offering healthy, organic meals and a peaceful yoga-inspired ambiance."
        }
      ]
    },
    {
      location: "Lower Parel",
      cafes: [
        {
          name: "The Pantry",
          image: "The Pantry.jpeg",
          info: "Bright cafe known for fresh organic food and coffee."
        },
        {
            name: "Grandmama's Cafe",
            image: "Grandmama_s Cafe.jpeg",
            info: "A charming cafe with whimsical decor, serving comfort food and delightful desserts."
        },
        {
            name: "Starbucks",
            image: "Starbucks.jpeg",
            info: "A globally recognized coffeehouse offering a wide range of specialty coffees and snacks."
        }
      ]
    }
  ];

  const container = document.getElementById('locations-container');

  data.forEach(({location, cafes}) => {
    const locationCard = document.createElement('div');
    locationCard.className = 'location-card';

    const locationTitle = document.createElement('h2');
    locationTitle.className = 'location-title';
    locationTitle.textContent = location;
    locationCard.appendChild(locationTitle);

    const cafesContainer = document.createElement('div');
    cafesContainer.className = 'cafes-container';

    cafes.forEach(({name, image, info}) => {
      const cafeCard = document.createElement('div');
      cafeCard.className = 'cafe-card';

      const img = document.createElement('img');
      img.className = 'cafe-image';
      img.src = image;
      img.alt = name;

      const cafeContent = document.createElement('div');
      cafeContent.className = 'cafe-content';

      const cafeName = document.createElement('div');
      cafeName.className = 'cafe-name';
      cafeName.textContent = name;

      const cafeInfo = document.createElement('div');
      cafeInfo.className = 'cafe-info';
      cafeInfo.textContent = info;

      cafeContent.appendChild(cafeName);
      cafeContent.appendChild(cafeInfo);

      cafeCard.appendChild(img);
      cafeCard.appendChild(cafeContent);

      cafesContainer.appendChild(cafeCard);
    });

    locationCard.appendChild(cafesContainer);
    container.appendChild(locationCard);
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
