<main class="container content-section">
    <h2 class="section-title">A Taste of the Streets</h2>

</main>

<footer class="bg-dark text-white text-center py-4">

<script>
  const data = [
    {
      location: "South Mumbai Classics",
      items: [
        {
          name: "Vada Pav at Ashok Vada Pav, Dadar",
          image: "Vada Pav at Ashok Vada Pav, Dadar.jpeg",
          info: "The quintessential Mumbai burger; a spiced potato fritter in a bread bun. An absolute must-try."
        },
        {
          name: "Pav Bhaji at Sardar's, Tardeo",
          image: "Pav Bhaji at Sardar_s, Tardeo.webp",
          info: "A medley of mashed vegetables in a spicy gravy, served with a generous amount of buttery bread rolls."
        },
        {
          name: "Kanda Bhaji at Chowpatty",
          image: "Kanda Bhaji at Chowpatty.jpeg",
          info: "Spiced onion fritters, deep-fried to perfection. The perfect snack for a rainy day by the sea."
        }
      ]
    },
    {
      location: "Juhu & Bandra Hotspots",
      items: [
        {
          name: "Bhel Puri at Juhu Beach",
          image: "Bhel Puri at Juhu Beach.jpeg",
          info: "A savory snack made of puffed rice, vegetables, and a tangy tamarind sauce. A must-try at Juhu Beach."
        },
        {
          name: "Pani Puri at Elco, Bandra",
          image: "Pani Puri at Elco, Bandra.jpeg",
          info: "Hollow crispy shells filled with potatoes, chickpeas, and spicy tangy water. A legendary spot for chaat."
        },
        {
          name: "Sev Puri at Carter Road",
          image: "Sev Puri at Carter Road.jpeg",
          info: "Crispy flat discs topped with potatoes, onions, chutneys, and a generous amount of sev (crispy noodles)."
        }
      ]
    },
    {
        location: "Mohammed Ali Road Delicacies",
        items: [
          {
            name: "Kebabs at Bademiya",
            image: "Kebabs at Bademiya.jpeg",
            info: "An iconic late-night spot famous for its succulent and flavourful minced meat and chicken kebabs."
          },
          {
            name: "Baida Roti near Minara Masjid",
            image: "Baida Roti near Minara Masjid.jpeg",
            info: "A pan-fried bread stuffed with spiced minced meat and egg. A specialty during the month of Ramzan."
          },
          {
            name: "Malpua with Rabri at Tawakkal Sweets",
            image: "Malpua with Rabri at Tawakkal Sweets.jpeg",
            info: "A sweet pancake-like dessert, deep-fried and soaked in syrup, often served with thickened sweet milk."
          }
        ]
    },
    {
      location: "Ghatkopar's Khau Galli",
      items: [
        {
          name: "Dabeli at a local stall",
          image: "Dabeli at a local stall.jpeg",
          info: "A sweet and spicy potato mixture stuffed in a pav, garnished with pomegranate and roasted peanuts."
        },
        {
          name: "Remix Dosa at Sai Swad Dosa",
          image: "Remix Dosa at Sai Swad Dosa.jpeg",
          info: "Ghatkopar is famous for its unique dosa varieties, often loaded with cheese, noodles, and various sauces."
        },
        {
          name: "Manchurian Frankie Roll",
          image: "Manchurian Frankie Roll.jpeg",
          info: "A fusion roll filled with spicy and tangy vegetable Manchurian, wrapped in a fresh roti."
        }
      ]
    },
    {
      location: "Matunga's South Indian Flavours",
      items: [
        {
          name: "Idli and Medu Vada at Ayyappan Idli",
          image: "Idli and Medu Vada at Ayyappan Idli.jpeg",
          info: "Soft, fluffy steamed rice cakes (idli) served with crispy lentil doughnuts (vada) and flavorful sambar."
        },
        {
          name: "Mysore Masala Dosa at Ram Ashraya",
          image: "Mysore Masala Dosa at Ram Ashraya.jpeg",
          info: "A crispy crepe with a spicy red chutney spread inside, filled with a potato masala."
        },
        {
          name: "Filter Coffee at Madras Cafe",
          image: "Filter Coffee at Madras Cafe.jpeg",
          info: "Authentic South Indian filter coffee, strong and aromatic, served in a traditional tumbler and dabarah."
        }
      ]
    },
    {
      location: "Fort & Colaba's Legacy Stalls",
      items: [
        {
          name: "Kheema Pav at Olympia Coffee House",
          image: "Kheema Pav at Olympia Coffee House.jpeg",
          info: "A flavorful and spicy minced meat curry served with soft bread rolls, a classic breakfast item."
        },
        {
          name: "Bun Maska & Chai at Yazdani Bakery",
          image: "Bun Maska & Chai at Yazdani Bakery.jpeg",
          info: "A soft bun smothered in butter, served with sweet Irani chai. A timeless Mumbai experience."
        },
        {
          name: "Frankie at Breadkraft, Fort",
          image: "Frankie at Breadkraft, Fort.jpeg",
          info: "One of the original Frankie rolls, with a variety of fillings wrapped in a perfectly cooked roti."
        }
      ]
    },
    {
      location: "City-Wide Sweet Treats & Drinks",
      items: [
        {
          name: "Kulfi Falooda at Bachelorr's",
          image: "Kulfi Falooda at Bachelorr_s.jpeg",
          info: "A rich and creamy Indian ice cream served with vermicelli noodles (falooda) and rose syrup."
        },
        {
          name: "Sugarcane Juice (Anywhere!)",
          image: "Sugarcane Juice (Anywhere!).jpeg",
          info: "Freshly pressed sugarcane juice, often mixed with ginger and lime, is a refreshing street-side drink."
        },
        {
          name: "Jalebi at Mumbadevi Jalebiwala",
          image: "Jalebi at Mumbadevi Jalebiwala.jpeg",
          info: "Deep-fried batter soaked in sugar syrup, served hot and crispy. A popular sweet across the city."
        }
      ]
    }
  ];

  const container = document.getElementById('locations-container');

  data.forEach(({location, items}) => {
    const locationCard = document.createElement('div');
    locationCard.className = 'location-card';

    const locationTitle = document.createElement('h2');
    locationTitle.className = 'location-title';
    locationTitle.textContent = location;
    locationCard.appendChild(locationTitle);

    const itemsContainer = document.createElement('div');
    itemsContainer.className = 'cafes-container'; 

    items.forEach(({name, image, info}) => {
      const itemCard = document.createElement('div');
      itemCard.className = 'cafe-card'; 

      const img = document.createElement('img');
      img.className = 'cafe-image'; 
      img.src = image;
      img.alt = name;

      const itemContent = document.createElement('div');
      itemContent.className = 'cafe-content'; 

      const itemName = document.createElement('div');
      itemName.className = 'cafe-name'; 
      itemName.textContent = name;

      const itemInfo = document.createElement('div');
      itemInfo.className = 'cafe-info'; 
      itemInfo.textContent = info;

      itemContent.appendChild(itemName);
      itemContent.appendChild(itemInfo);

      itemCard.appendChild(img);
      itemCard.appendChild(itemContent);

      itemsContainer.appendChild(itemCard);
    });

    locationCard.appendChild(itemsContainer);
    container.appendChild(locationCard);
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
