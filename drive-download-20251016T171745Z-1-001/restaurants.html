<script>
  const data = [
    {
      location: "Bandra",
      restaurants: [
        {
          name: "Gigi",
          image: "gigi.jpeg",
          info: "A chic European restaurant offering modern cuisine and cocktails in Bandra West."
        },
        {
          name: "Vietnom",
          image: "Vietnom.jpeg",
          info: "Authentic Vietnamese flavors with a cozy atmosphere and creative plating."
        },
        {
          name: "The Nest",
          image: "The Nest.jpeg",
          info: "Trendy restaurant serving global fusion dishes and refreshing drinks."
        }
      ]
    },
    {
      location: "Colaba",
      restaurants: [
        {
          name: "The Table",
          image: "The Table.jpeg",
          info: "World-inspired fine dining with elegant interiors and fresh local ingredients."
        },
        {
          name: "Wasabi by Morimoto",
          image: "Wasabi by Morimoto.jpeg",
          info: "Luxury Japanese dining experience at the Taj Mahal Palace Hotel."
        },
        {
          name: "Indigo Delicatessen",
          image: "Indigo Delicatessen.jpeg",
          info: "A popular deli offering European comfort food in a chic, relaxed setting."
        }
      ]
    },
    {
      location: "Juhu",
      restaurants: [
        {
          name: "The Bombay Curry",
          image: "The Bombay Curry.jpeg",
          info: "Casual restaurant serving flavorful North Indian and Mughlai cuisine."
        },
        {
            name: "Mahesh Lunch Home",
            image: "Mahesh Lunch Home.jpeg",
            info: "A legendary restaurant celebrated for its authentic Mangalorean seafood."
        },
        {
            name: "Estella",
            image: "Estella.jpeg",
            info: "A stunning seaside restaurant offering modern Australian cuisine and vibrant nightlife."
        }
      ]
    },
    {
      location: "Andheri",
      restaurants: [
        {
          name: "P.F. Chang’s",
          image: "P.F. Chang’s.jpeg",
          info: "Popular chain serving Pan-Asian dishes in a modern, lively setting."
        },
        {
          name: "The Tanjore Tiffin Room",
          image: "The Tanjore Tiffin Room.jpeg",
          info: "Authentic South Indian restaurant with a charming old-world feel."
        },
        {
          name: "Sathe’s All Day Diner",
          image: "Sathe’s All Day Din.jpeg",
          info: "Casual dining spot offering an extensive multi-cuisine menu all day long."
        }
      ]
    },
    {
      location: "Fort",
      restaurants: [
        {
          name: "Burma Burma",
          image: "Burma Burma.jpeg",
          info: "Vegetarian Burmese restaurant and tea room offering exotic flavors."
        },
        {
          name: "Bombay Canteen",
          image: "Bombay Canteen.jpeg",
          info: "Celebrates Indian regional dishes with a contemporary twist."
        },
        {
            name: "Trishna",
            image: "Trishna.jpeg",
            info: "An iconic seafood restaurant, famous for its butter garlic crab."
        }
      ]
    },
    {
      location: "Versova",
      restaurants: [
        {
          name: "The Fatty Bao",
          image: "The Fatty Bao.jpeg",
          info: "Playful Asian restaurant with a colorful interior and creative sushi options."
        },
        {
          name: "The Local",
          image: "The Local1.jpeg",
          info: "Trendy spot with live music, great cocktails, and comfort food."
        },
        {
            name: "Jamjar Diner",
            image: "Jamjar Dine.jpeg",
            info: "A quirky, vibrant diner known for its comfort food, shakes, and all-day breakfast."
        }
      ]
    },
    {
      location: "Lower Parel",
      restaurants: [
        {
          name: "The Sahib Room & Kipling Bar",
          image: "The Sahib Room & Kipling Bar.jpeg",
          info: "Refined Indian restaurant at The St. Regis Mumbai, elegant and aromatic."
        },
        {
          name: "By The Mekong",
          image: "By The Mekong.jpeg",
          info: "Asian fine dining offering panoramic views and exquisite flavors."
        },
        {
            name: "Pa Pa Ya",
            image: "Pa Pa Ya.jpeg",
            info: "A modern Asian bistro known for its innovative culinary techniques and tapas-style plates."
        }
      ]
    }
  ];

  const container = document.getElementById('locations-container');

  data.forEach(({location, restaurants}) => {
    const locationCard = document.createElement('div');
    locationCard.className = 'location-card';

    const locationTitle = document.createElement('h2');
    locationTitle.className = 'location-title';
    locationTitle.textContent = location;
    locationCard.appendChild(locationTitle);

    const restaurantsContainer = document.createElement('div');
    restaurantsContainer.className = 'restaurants-container';

    restaurants.forEach(({name, image, info}) => {
      const restaurantCard = document.createElement('div');
      restaurantCard.className = 'restaurant-card';

      const img = document.createElement('img');
      img.className = 'restaurant-image';
      img.src = image;
      img.alt = name;

      const restaurantContent = document.createElement('div');
      restaurantContent.className = 'restaurant-content';

      const restaurantName = document.createElement('div');
      restaurantName.className = 'restaurant-name';
      restaurantName.textContent = name;

      const restaurantInfo = document.createElement('div');
      restaurantInfo.className = 'restaurant-info';
      restaurantInfo.textContent = info;

      restaurantContent.appendChild(restaurantName);
      restaurantContent.appendChild(restaurantInfo);

      restaurantCard.appendChild(img);
      restaurantCard.appendChild(restaurantContent);

      restaurantsContainer.appendChild(restaurantCard);
    });

    locationCard.appendChild(restaurantsContainer);
    container.appendChild(locationCard);
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
