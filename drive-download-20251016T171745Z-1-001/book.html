

<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <title>Book - Mumbai Tourism</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
          <link rel="stylesheet" href="global-theme.css">



  <style>
    body {
      font-family: 'Poppins', sans-serif;
  
      color: #333;
    }
    .booking-container {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; color: #0077b6; }
    label { font-weight: 600; display: block; margin-top: 15px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      padding: 12px 18px;
      background: #0077b6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #023e8a; }
    #confirmation {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .btns { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
  
  </style>
</head>
<body>

  <!-- Navbar -->
 <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">🏙️ Explore Mumbai</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="places.html">Places</a></li>
                <li class="nav-item"><a class="nav-link" href="food.html">Food</a></li>
                <li class="nav-item"><a class="nav-link" href="itinerary.html">Itinerary</a></li>
                <li class="nav-item"><a class="nav-link" href="hotel.html">Hotel</a></li>
                <li class="nav-item"><a class="nav-link" href="weather.html">Weather</a></li>
                <li class="nav-item"><a class="nav-link" href="feedback.html">Reviews</a></li>
                
                <li class="nav-item">
                    <a id="dynamic-auth-button" class="nav-link btn btn-primary text-white ms-lg-2" href="login.html">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

  <!-- Booking Container -->
  <div class="booking-container">
    <h2 id="title">Book Your Trip</h2>
    <form id="bookingForm">
      <label>Name</label>
      <input type="text" id="name" placeholder="Enter full name" required>

      <label>Date</label>
      <input type="date" id="date" required>

      <div id="extraFields"></div>

      <button type="submit">Confirm Booking</button>
    </form>

    <div id="confirmation">
      <h3>✅ Booking Confirmed!</h3>
      <p id="receipt"></p>
      <div class="btns">
        <button onclick="window.print()">🖨️ Print Receipt</button>
        <button id="downloadPDF">💾 Download PDF</button>
      </div>
    </div>
  </div>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    // Set min date to today
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById("date").setAttribute("min", `${yyyy}-${mm}-${dd}`);

    const params = new URLSearchParams(window.location.search);
    const type = params.get("type") || "itinerary"; 
    const name = params.get("name") || params.get("plan") || "Custom Trip";
    const price = params.get("price") || "N/A";

    const title = document.getElementById("title");
    const extraFields = document.getElementById("extraFields");

    if (type === "hotel") {
      title.textContent = "Hotel Booking";
      extraFields.innerHTML = `
        <label>Hotel Name</label>
        <input type="text" value="${name}" readonly>
        <label>Room Type</label>
        <select id="roomType" required>
          <option value="">-- Select Room Type --</option>
          <option>Deluxe Room</option>
          <option>Suite</option>
          <option>Budget Room</option>
        </select>
        <label>Nights</label>
        <input type="number" id="nights" placeholder="Number of nights" min="1" required>
      `;
    } else {
      title.textContent = "Itinerary Booking";
      extraFields.innerHTML = `
        <label>Itinerary Plan</label>
        <input type="text" value="${name}" readonly>
        <label>Select Guide</label>
        <select id="guide" required>
          <option value="">-- Select Guide --</option>
          <option>Ravi Mehta</option>
          <option>Priya Nair</option>
          <option>Sameer Khan</option>
          <option>Neha Patel</option>
          <option>John D’Souza</option>
        </select>
      `;
    }

    document.getElementById("bookingForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const userName = document.getElementById("name").value.trim();
      const date = document.getElementById("date").value;
      const nameRegex = /^[A-Za-z ]+$/;

      // Validation
      if (!nameRegex.test(userName)) {
        alert("Name should contain only letters and spaces.");
        return;
      }

      const selectedDate = new Date(date);
      if (selectedDate < today.setHours(0,0,0,0)) {
        alert("Date cannot be in the past.");
        return;
      }

      let details = "";

      if (type === "hotel") {
        const roomType = document.getElementById("roomType").value;
        const nights = parseInt(document.getElementById("nights").value);

        if (!roomType) {
          alert("Please select a room type.");
          return;
        }
        if (isNaN(nights) || nights < 1) {
          alert("Number of nights must be at least 1.");
          return;
        }

        details = `<strong>Hotel:</strong> ${name}<br>
                   <strong>Room Type:</strong> ${roomType}<br>
                   <strong>Nights:</strong> ${nights}`;
      } else {
        const guide = document.getElementById("guide").value;
        if (!guide) {
          alert("Please select a guide.");
          return;
        }
        details = `<strong>Itinerary:</strong> ${name}<br>
                   <strong>Guide:</strong> ${guide}`;
      }

      document.getElementById("confirmation").style.display = "block";
      document.getElementById("bookingForm").style.display = "none";
      document.getElementById("receipt").innerHTML = `
        <strong>Name:</strong> ${userName}<br>
        <strong>Date:</strong> ${date}<br>
        ${details}<br>
        <strong>Price:</strong> ₹${price}
      `;

      // PDF Generation
      document.getElementById("downloadPDF").onclick = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFillColor(0, 119, 182);
        doc.rect(0, 0, 210, 25, "F");
        doc.setFont("helvetica", "bold");
        doc.setTextColor(255,255,255);
        doc.setFontSize(16);
        doc.text("Mumbai Tourism", 105, 17, {align:"center"});

        doc.setDrawColor(0,119,182);
        doc.rect(15,35,180,110,"S");

        doc.setFont("helvetica","bold");
        doc.setFontSize(14);
        doc.setTextColor(0,119,182);
        doc.text("Booking Receipt",105,45,{align:"center"});

        doc.setFont("helvetica","normal");
        doc.setFontSize(12);
        doc.setTextColor(0,0,0);
        let y = 60;
        doc.text(`Name: ${userName}`,25,y);
        doc.text(`Date: ${date}`,25,y+10);
        doc.text(`${type==="hotel"?"Hotel":"Itinerary"}: ${name}`,25,y+20);
        if(type==="hotel"){
          doc.text(`Room Type: ${document.getElementById("roomType").value}`,25,y+30);
          doc.text(`Nights: ${document.getElementById("nights").value}`,25,y+40);
        } else {
          doc.text(`Guide: ${document.getElementById("guide").value}`,25,y+30);
        }
        doc.text(`Price: ₹${price}`,25,y+50);

        doc.setFont("helvetica","italic");
        doc.setFontSize(11);
        doc.setTextColor(100,100,100);
        doc.text("Thank you for booking with Mumbai Tourism!",105,145,{align:"center"});

        doc.save(`${userName}_Booking_Receipt.pdf`);
      };
    });

    // Check if a user is logged in
   if (!localStorage.getItem("loggedInUser")) {
      // 1. Remember the page the user was on
      localStorage.setItem('redirectUrl', window.location.href);

      // 2. Alert and redirect
      alert("Please log in to continue your booking.");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
