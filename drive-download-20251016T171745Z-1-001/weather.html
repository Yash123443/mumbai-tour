        .weather-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); transition: transform 0.3s ease; background-color: #ffffff; }
        .weather-card:hover { transform: translateY(-5px); }
        .weather-card.current-day { background: linear-gradient(135deg, #6dd5ed, #2193b0); color: white; }

    <header class="page-header" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('weather.jpg');">
        <h1>Mumbai Weather</h1>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center mb-4">
            <div class="col-md-8 col-lg-6">
                <form id="search-form" class="d-flex">
                    <input id="city-input" class="form-control me-2" type="search" placeholder="Enter a city or area" aria-label="Search" value="Mumbai">
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
            </div>
        </div>

        <div id="weather-container">
            <div id="weather-loader" class="text-center">
                <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
                <p class="mt-2">Fetching weather data...</p>
            </div>
            <div id="weather-error" class="alert alert-danger d-none text-center"></div>
            
            <div id="weather-content" class="d-none">
                <h2 id="location-title" class="text-center mb-4"></h2>
                <div class="row g-4">
                    <div class="col-12">
                        <h3 class="section-title">Today</h3>
                        <div id="today-weather-card"></div>
                    </div>
                    <div class="col-12">
                        <h3 class="section-title">Next 3 Days Forecast</h3>
                        <div id="forecast-container" class="row g-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">© 2025 Explore Mumbai | All Rights Reserved</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const apiKey = 'fdebd89172864b05916183437251210';

            const searchForm = document.getElementById('search-form');
            const cityInput = document.getElementById('city-input');
            const loader = document.getElementById('weather-loader');
            const errorDiv = document.getElementById('weather-error'); 
            const contentDiv = document.getElementById('weather-content');
            const locationTitle = document.getElementById('location-title');
            const todayContainer = document.getElementById('today-weather-card');
            const forecastContainer = document.getElementById('forecast-container');

            const capitalize = (str) => {
                return str.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
            };

            const getWeather = async (city) => {
                loader.classList.remove('d-none');
                contentDiv.classList.add('d-none');
                errorDiv.classList.add('d-none'); 
                todayContainer.innerHTML = '';
                forecastContainer.innerHTML = '';

                try {
                    const response = await fetch(`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${city}&days=4&aqi=no&alerts=no`);
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error.message);
                    }
                    const weatherData = await response.json();
                    
                    locationTitle.textContent = `Weather for ${capitalize(city)}`;
                    
                    renderToday(weatherData.current, weatherData.forecast.forecastday[0].day);
                    for (let i = 1; i <= 3; i++) {
                        renderForecast(weatherData.forecast.forecastday[i]);
                    }
                    contentDiv.classList.remove('d-none');

                } catch (error) {
                    // ## CHANGE 2 ##: Yeh line error ko page par dikhayegi
                    errorDiv.textContent = `Error: ${error.message}. Please try a more specific search (e.g., 'Thane, Mumbai').`;
                    errorDiv.classList.remove('d-none');
                } finally {
                    loader.classList.add('d-none');
                }
            };

            const formatDate = (dateString) => {
                const options = { weekday: 'long', month: 'long', day: 'numeric' };
                return new Date(dateString + 'T00:00:00').toLocaleDateString('en-US', options);
            };

            function renderToday(current, day) {
                todayContainer.innerHTML = `
                    <div class="card weather-card current-day">
                        <div class="card-body">
                            <h4 class="card-title">${formatDate(current.last_updated.split(' ')[0])}</h4>
                            <div class="d-flex align-items-center">
                                <img src="https:${current.condition.icon}" alt="${current.condition.text}" class="weather-icon-lg">
                                <div class="ms-3">
                                    <p class="display-4 mb-0">${Math.round(current.temp_c)}°C</p>
                                    <p class="lead">${current.condition.text}</p>
                                </div>
                            </div>
                            <div class="row mt-3 text-center">
                                <div class="col"><strong>Max:</strong> ${Math.round(day.maxtemp_c)}°C</div>
                                <div class="col"><strong>Min:</strong> ${Math.round(day.mintemp_c)}°C</div>
                                <div class="col"><strong>Wind:</strong> ${current.wind_kph} kph</div>
                                <div class="col"><strong>Humidity:</strong> ${current.humidity}%</div>
                            </div>
                        </div>
                    </div>`;
            }

            function renderForecast(dayData) {
                forecastContainer.innerHTML += `
                    <div class="col-md-4">
                        <div class="card weather-card h-100">
                            <div class="card-body text-center">
                                <h5 class="card-title">${formatDate(dayData.date)}</h5>
                                <img src="https:${dayData.day.condition.icon}" alt="${dayData.day.condition.text}" class="weather-icon-sm">
                                <p class="card-text fs-4">${Math.round(dayData.day.avgtemp_c)}°C</p>
                                <p class="card-text">${dayData.day.condition.text}</p>
                                <p class="card-text small">Max: ${Math.round(dayData.day.maxtemp_c)}°C / Min: ${Math.round(dayData.day.mintemp_c)}°C</p>
                            </div>
                        </div>
                    </div>`;
            }

            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const city = cityInput.value.trim();
                if (city) getWeather(city);
            });
            
            getWeather('Mumbai');
        });
    </script>
</body>
</html>
